# Pinned dependencies for OCR microservice (local / CUDA 12.9).
# Re-generate: pip freeze > requirements-ocr.lock
#
# Use cu129 wheels (paddle.version.cuda() -> 12.9). For bastion CUDA 12.6 see
# requirements-ocr-cu126.lock and: OCR_CUDA=cu126 bash deploy/pack-ocr-offline.sh
# NVIDIA Container Toolkit injects host CUDA libs at runtime; image only needs libgomp etc.
#
# paddleocr 3.7.x required for PP-OCRv6_medium_* engine bindings (3.6.x fails with
# "No engine bindings registered for model 'PP-OCRv6_medium_det'").
--extra-index-url https://www.paddlepaddle.org.cn/packages/stable/cu129/
