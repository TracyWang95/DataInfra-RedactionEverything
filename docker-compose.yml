# DataInfra-RedactionEverything docker compose
#
# CPU API/frontend only:
#   docker compose up -d
#
# Full GPU model stack:
#   docker compose --profile gpu up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: ${BACKEND_ENV_FILE:-.env}
        required: false
    environment:
      - DEBUG=${DEBUG:-false}
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - VIRUS_SCAN_ENABLED=${VIRUS_SCAN_ENABLED:-false}
      - OCR_REQUIRE_GPU=${OCR_REQUIRE_GPU:-false}
      - JOB_CONCURRENCY=${JOB_CONCURRENCY:-3}
      - BATCH_RECOGNITION_PAGE_CONCURRENCY=${BATCH_RECOGNITION_PAGE_CONCURRENCY:-1}
      - HAS_NER_MAX_PARALLEL_REQUESTS=${HAS_NER_MAX_PARALLEL_REQUESTS:-1}
      - VISUAL_FEATURES_CONCURRENCY=${VISUAL_FEATURES_CONCURRENCY:-1}
      - VISION_DUAL_PIPELINE_PARALLEL=${VISION_DUAL_PIPELINE_PARALLEL:-false}
      - OCR_BASE_URL=http://ocr:8082
      - HAS_TEXT_RUNTIME=${HAS_TEXT_RUNTIME:-vllm}
      - HAS_TEXT_VLLM_BASE_URL=http://ner:8080/v1
      - HAS_TEXT_MODEL_NAME=${HAS_TEXT_MODEL_NAME:-HaS_Text_0209_0.6B}
      - VISUAL_FEATURES_BASE_URL=http://visual-features:8090
      - HAS_IMAGE_URL=${HAS_IMAGE_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:${FRONTEND_PORT:-3000}","http://127.0.0.1:${FRONTEND_PORT:-3000}"]}
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
      - backend-outputs:/app/outputs
    networks:
      - redaction-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - redaction-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ocr:
    build:
      context: ./backend
      dockerfile: Dockerfile.ocr
    # python entry loads models; do not use `uvicorn ocr_server:app` alone.
    command: ["python", "ocr_server.py"]
    ports:
      - "${OCR_PORT:-8082}:8082"
    environment:
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - PADDLE_PDX_CACHE_HOME=/opt/paddlex
      - OCR_STRUCTURE_ENABLED=${OCR_STRUCTURE_ENABLED:-true}
      - OCR_STRUCTURE_PRIMARY=${OCR_STRUCTURE_PRIMARY:-true}
      - OCR_STRUCTURE_WARMUP=${OCR_STRUCTURE_WARMUP:-1}
      - OCR_VL_ENABLED=${OCR_VL_ENABLED:-1}
      - OCR_PORT=8082
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - redaction-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8082/health').raise_for_status()"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s
    profiles:
      - gpu
    restart: unless-stopped

  ner:
    # Same runtime and weights as local development (vLLM + HF bf16), so the
    # NER behavior validated locally carries over to Docker unchanged.
    image: vllm/vllm-openai:v0.19.1
    ipc: host
    ports:
      - "${NER_PORT:-8080}:8080"
    volumes:
      - ./backend/models:/models
    command:
      - --model
      - /models/has/HaS_Text_0209_0.6B
      - --served-model-name
      - HaS_Text_0209_0.6B
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --trust-remote-code
      - --dtype
      - bfloat16
      - --max-model-len
      - "4096"
      - --max-num-batched-tokens
      - "4096"
      - --gpu-memory-utilization
      - "0.18"
      - --kv-cache-memory-bytes
      - "671088640"
      - --no-enable-prefix-caching
      - --enforce-eager
      - --default-chat-template-kwargs
      - '{"enable_thinking":false}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - redaction-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    profiles:
      - gpu
    restart: unless-stopped

  # GLM-4.6V-Flash visual grounding via vLLM (OpenAI-compatible).
  glm-vllm:
    image: vllm/vllm-openai:v0.19.1
    ipc: host
    ports:
      - "${GLM_VLLM_PORT:-8120}:8120"
    volumes:
      - ./backend/models:/models
    command:
      - --model
      - /models/glm/${GLM_MODEL_NAME:-glm-fp8}
      - --served-model-name
      - ${GLM_MODEL_NAME:-glm-fp8}
      - --host
      - 0.0.0.0
      - --port
      - "8120"
      - --trust-remote-code
      - --dtype
      - ${GLM_DTYPE:-bfloat16}
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.45"
      - --enforce-eager
      - --default-chat-template-kwargs
      - '{"enable_thinking":false}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - redaction-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8120/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    profiles:
      - gpu
    restart: unless-stopped

  # GLM visual-grounding adapter: translates /detect -> GLM chat/completions.
  visual-features:
    build:
      context: ./backend
      dockerfile: Dockerfile.glm
    ports:
      - "${VISUAL_FEATURES_PORT:-8090}:8090"
    environment:
      - GLM_BASE_URL=${GLM_BASE_URL:-http://glm-vllm:8120/v1}
      - GLM_MODEL_NAME=${GLM_MODEL_NAME:-glm-fp8}
      - GLM_VISUAL_PORT=8090
    depends_on:
      glm-vllm:
        condition: service_healthy
    networks:
      - redaction-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8090/health').raise_for_status()"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    profiles:
      - gpu
    restart: unless-stopped

  # HaS-Image YOLO11 small-object supplement detector (optional).
  has-image:
    build:
      context: ./backend
      dockerfile: Dockerfile.hasimage
    ports:
      - "${HAS_IMAGE_PORT:-8081}:8081"
    environment:
      - HAS_IMAGE_PORT=8081
      - HAS_IMAGE_DEVICE=${HAS_IMAGE_DEVICE:-0}
      - HAS_IMAGE_WEIGHTS=${HAS_IMAGE_WEIGHTS:-/models/has_image/sensitive_seg_best.pt}
    volumes:
      - ./backend/models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - redaction-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8081/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    profiles:
      - gpu
    restart: unless-stopped

volumes:
  backend-data:
  backend-uploads:
  backend-outputs:

networks:
  redaction-net:
    driver: bridge
