# Nginx 配置 - 前后端服务器专用
# 与原 nginx.conf 的区别: backend 地址改为宿主机 IP（因为不在同一 docker network）
#
# 部署方式: 替换 frontend/nginx.conf 后重新构建 frontend 镜像
# 或者直接在 frontend 容器内挂载此文件

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'" always;

    # 前端路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端
    # 注意: docker-compose.app.yml 中 frontend 和 backend 在同一 docker network，
    # 所以这里仍然用 backend 作为 hostname（docker DNS 解析）。
    # 如果 frontend 不用 docker 而是直接 nginx 部署，需改为宿主机 IP:
    #   proxy_pass http://127.0.0.1:8000;
    location /api {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 100M;

        # 跨网络调用模型服务，超时适当放大
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 健康检查
    location /health {
        proxy_pass http://backend:8000;
        proxy_read_timeout 60s;
    }

    # 缓存静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}
