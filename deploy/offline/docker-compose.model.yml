# ============================================================
# 离线部署 - 模型服务器 (GPU 机器)
# 包含: OCR / Visual-Features (GLM 适配器) / YOLO (HaS-Image)
# 注意: NER(vLLM) 和 GLM-vLLM 均已移除，需使用外部已部署的 vLLM 服务
#       GLM 模型文件也不包含，需在外部 vLLM 服务器上自行部署
#
# 用法:
#   docker compose -f docker-compose.model.yml up -d
# ============================================================

services:
  # PP-StructureV3 OCR (GPU)
  ocr:
    image: redaction-ocr:latest
    ports:
      - "${OCR_PORT:-8082}:8082"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - model-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8082/health').raise_for_status()"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # GLM visual-grounding adapter: /detect -> 外部 GLM vLLM chat/completions
  visual-features:
    image: redaction-visual-features:latest
    ports:
      - "${VISUAL_FEATURES_PORT:-8090}:8090"
    environment:
      - GLM_BASE_URL=${GLM_BASE_URL:-http://<MODEL_SERVER_IP>:8120/v1}
      - GLM_MODEL_NAME=${GLM_MODEL_NAME:-GLM-4.6V-Flash}
      - GLM_VISUAL_PORT=8090
    networks:
      - model-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8090/health').raise_for_status()"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # HaS-Image YOLO11 small-object supplement detector
  has-image:
    image: redaction-has-image:latest
    ports:
      - "${HAS_IMAGE_PORT:-8081}:8081"
    environment:
      - HAS_IMAGE_PORT=8081
      - HAS_IMAGE_DEVICE=${HAS_IMAGE_DEVICE:-0}
      - HAS_IMAGE_WEIGHTS=${HAS_IMAGE_WEIGHTS:-/models/has_image/sensitive_seg_best.pt}
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - model-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8081/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

networks:
  model-net:
    driver: bridge
